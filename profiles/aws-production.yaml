profile: aws-production
description: "AWS Production - Full managed services"

ui:
  enabled: true
  type: genu

database:
  relational:
    enabled: true
    engine: rds-postgresql

nosql:
  enabled: true
  engine: dynamodb

storage:
  enabled: true
  engine: s3

search:
  enabled: true
  engine: opensearch-service

graph:
  enabled: true
  engine: neptune

rdf:
  enabled: false

agent:
  enabled: true
  runtime: agentcore

llm:
  enabled: true
  provider: bedrock
  bedrock_model_id: anthropic.claude-3-5-sonnet-20241022-v2:0

redis:
  enabled: true
  engine: elasticache
