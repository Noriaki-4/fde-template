profile: graph-rag
description: "RAG with Graph Database + Gemma 4 LLM"

llm:
  enabled: true
  provider: ollama
  model: gemma:4-e4b

ui:
  enabled: true
  type: gradio

database:
  relational:
    enabled: true
    engine: postgresql

storage:
  enabled: true
  engine: minio

search:
  enabled: true
  engine: opensearch

graph:
  enabled: true
  engine: neo4j
  query_language: opencypher

agent:
  enabled: false

redis:
  enabled: false
