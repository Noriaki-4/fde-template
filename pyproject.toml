[project]
name = "fde-template"
version = "0.1.0"
description = "FDE Modular AI PoC Platform"
requires-python = ">=3.11"
authors = [{name = "FDE Team"}]
readme = "README.md"

dependencies = [
    # Web Framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.6.1",

    # Database
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",

    # Storage
    "minio==7.2.13",
    "boto3>=1.34.0",

    # Search & Graph (Phase 2+)
    "opensearch-py==2.6.0",
    "neo4j==5.27.0",

    # HTTP
    "requests==2.32.3",
    "httpx==0.27.0",

    # CLI (Phase 6)
    "click==8.1.8",
    "pyyaml==6.0.2",

    # Utilities
    "pydantic-yaml==1.3.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
]

[project.scripts]
fde = "cli.fde_cli:cli"

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-docker==3.0.0",
    "black==24.10.0",
    "ruff==0.8.2",
    "mypy==1.14.1",
    "pre-commit==3.8.0",
]

ui = [
    "gradio==4.44.1",
    "streamlit==1.40.0",
]

llm = [
    "ollama==0.4.4",
    "anthropic==0.42.0",
]

agent = [
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
]

nosql = [
    "boto3>=1.34.0",
]

bedrock = [
    "anthropic==0.42.0",
    "boto3>=1.34.0",
]

mcp = [
    "mcp[cli]>=1.2.0,<2.0.0",  # 2.0.0 restructured the API (fastmcp module removed); pin to the 1.x line
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line-too-long (black handles it)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers --disable-warnings"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "docker: tests requiring docker",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
