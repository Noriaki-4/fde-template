version: '3.8'

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:16-alpine
    container_name: fde-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fde_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fde-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # FastAPI Backend
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: fde-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/fde_poc
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: knowledge-root
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
      - ../projects:/app/projects
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Gradio UI
  gradio:
    build:
      context: ..
      dockerfile: frontend/gradio/Dockerfile
    container_name: fde-gradio
    environment:
      BACKEND_URL: http://backend:8000
      PYTHONUNBUFFERED: 1
    ports:
      - "7860:7860"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../frontend/gradio:/app
    command: python app.py

  # OpenSearch (Phase 2+)
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: fde-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    profiles:
      - with-search

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: fde-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    profiles:
      - with-search

  # Neo4j (Phase 3+ Property Graph)
  neo4j:
    image: neo4j:5.26.1-community
    container_name: fde-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    profiles:
      - with-graph

  # Virtuoso (Phase 3+ RDF)
  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    container_name: fde-virtuoso
    environment:
      DBA_PASSWORD: dba
      SPARQL_UPDATE: "true"
    ports:
      - "8890:8890"
      - "1111:1111"
    volumes:
      - virtuoso_data:/var/lib/virtuoso/db
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8890/sparql >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    profiles:
      - with-rdf
      - with-graph

  # ScyllaDB Alternator (Phase 7+ NoSQL)
  scylladb:
    image: scylladb/scylla:latest
    container_name: fde-scylladb
    command: --listen-address 0.0.0.0 --rpc-address 0.0.0.0 --alternator-port 8000
    environment:
      SCYLLA_SEEDS: scylladb
    ports:
      - "9042:9042"
      - "8000:8000"
    volumes:
      - scylladb_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    profiles:
      - with-nosql

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  opensearch_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  virtuoso_data:
    driver: local
  scylladb_data:
    driver: local

networks:
  default:
    name: fde-network
    driver: bridge
